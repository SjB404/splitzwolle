<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ontdek Zwolle — toen en nu. Plan je wandel- of fietsroute, bekijk routes van anderen en wissel tussen de historische kaart en de actuele plattegrond."
    />
    <title>Zwolle Routes — Ontdek Zwolle toen en nu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- material symbols subset; names stay alphabetical and new icons must be added here too -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=account_balance,add,apps,arrow_back,arrow_drop_down,arrow_forward,bookmark,bookmark_border,build,call,check,check_box,check_box_outline_blank,check_circle,chevron_right,close,dark_mode,directions_bike,directions_walk,error,expand_less,expand_more,flag,handshake,info,light_mode,local_fire_department,location_on,lock,logout,mail,menu,more_horiz,museum,open_in_new,park,person,person_add,place,remove,restaurant,route,schedule,search,send,share,star&display=block"
      rel="stylesheet"
    />
    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <!-- `light` required: without it beerCSS follows the OS preference and its own palette -->
  <body class="light">
    <div id="root"></div>
    <!-- applies the saved theme before first paint; key must stay in sync with navbar.tsx -->
    <script>
      try {
        var theme = localStorage.getItem("zwolle-routes:theme");
        if (theme) document.body.className = theme;
      } catch (error) {
        /* storage can be blocked; the light default already applies */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
